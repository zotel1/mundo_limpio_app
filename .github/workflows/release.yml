# Release APK pipeline para MundoLimpio App
#
# Se ejecuta en cada push a develop (post-merge de PRs).
# Construye APK release firmado y lo distribuye vía Firebase App Distribution.
#
# Requiere los siguientes GitHub Secrets:
# - GOOGLE_SERVICES_JSON: archivo google-services.json codificado en base64
# - KEYSTORE_BASE64: keystore de release codificado en base64
# - KEYSTORE_PASSWORD: contraseña del keystore
# - KEY_PASSWORD: contraseña de la clave
# - KEY_ALIAS: alias de la clave en el keystore
# - FIREBASE_APP_ID: ID de la app en Firebase
# - FIREBASE_TOKEN: token de autenticación de Firebase CI

name: Release APK

on:
  push:
    branches: [develop]

jobs:
  build-and-distribute:
    name: Build & Distribute
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 📦 Instalar dependencias
        run: flutter pub get

      - name: 🔑 Decodificar google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: 🔐 Decodificar keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/mundolimpio.keystore

      - name: 📝 Crear key.properties
        run: |
          echo "storeFile=mundolimpio.keystore" > android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties

      - name: 🔨 Build APK release
        run: flutter build apk --release

      - name: 🚀 Subir a Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          file: build/app/outputs/flutter-apk/app-release.apk

      - name: 📦 Archivar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
