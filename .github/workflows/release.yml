# Release APK pipeline para MundoLimpio App
#
# Se ejecuta en cada push a develop (post-merge de PRs).
# Construye APK y (cuando haya secrets) lo distribuye vía Firebase App Distribution.
#
# Requiere los siguientes GitHub Secrets para release firmado + Firebase:
# - GOOGLE_SERVICES_JSON: archivo google-services.json codificado en base64
# - KEYSTORE_BASE64: keystore de release codificado en base64
# - KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS: credenciales del keystore
# - FIREBASE_APP_ID, FIREBASE_TOKEN: para Firebase App Distribution
#
# Sin secrets: build debug APK y archiva como artefacto (verifica que compila).

name: Release APK

on:
  push:
    branches: [develop]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 📦 Instalar dependencias
        run: flutter pub get

      - name: 🔨 Build APK debug
        run: flutter build apk --debug

      - name: 📦 Archivar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ─── Release firmado + Firebase Distribution ─────────────────
