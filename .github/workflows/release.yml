# Release APK pipeline para MundoLimpio App
#
# Se ejecuta en cada push a develop. Construye APK y lo distribuye.
#
# Secrets requeridos en GitHub:
# - GOOGLE_SERVICES_JSON: google-services.json en base64 (OBLIGATORIO para build)
# - KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS (opcional — release firmado)
# - FIREBASE_APP_ID, FIREBASE_TOKEN (opcional — Firebase App Distribution)
#
# Sin keystore: build debug APK sin firmar
# Con keystore: build release APK firmado
# Con Firebase: distribuye automáticamente a testers

name: Release APK

on:
  push:
    branches: [develop]

jobs:
  build:
    name: Build & Distribute
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 📦 Instalar dependencias
        run: flutter pub get

      - name: 🔑 Decodificar google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: 🔨 Build APK debug
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: flutter build apk --debug

      - name: 🔐 Decodificar keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/mundolimpio.keystore

      - name: 📝 Crear key.properties
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "storeFile=mundolimpio.keystore" > android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties

      - name: 🔨 Build APK release
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: flutter build apk --release

      - name: 📦 Archivar APK debug
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: 🚀 Firebase App Distribution
        if: ${{ secrets.FIREBASE_TOKEN != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          file: build/app/outputs/flutter-apk/app-release.apk

      - name: 📦 Archivar APK release
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
